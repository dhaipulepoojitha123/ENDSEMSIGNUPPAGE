<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup Page</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="signup-shell">
    <section class="signup-card" aria-label="Create an account">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img">
            <path d="M12 3.2 20 7v5.1c0 5-3.4 7.8-8 8.7-4.6-.9-8-3.7-8-8.7V7l8-3.8Z"/>
            <path d="m8.7 12.1 2.1 2.1 4.6-4.7"/>
          </svg>
        </span>
        <span>NOVA</span>
      </div>

      <div class="card-content">
        <header>
          <p class="eyebrow">Get started</p>
          <h1>Signup Page</h1>
          <p class="subtitle">Join Nova and start building something great.</p>
        </header>

        <form id="signupForm" novalidate>
          <div class="field-row">
            <div class="field">
              <label for="firstName">First name</label>
              <input type="text" id="firstName" name="firstName" placeholder="Alex" autocomplete="given-name" required>
              <small class="error" id="firstNameError"></small>
            </div>

            <div class="field">
              <label for="lastName">Last name</label>
              <input type="text" id="lastName" name="lastName" placeholder="Morgan" autocomplete="family-name" required>
              <small class="error" id="lastNameError"></small>
            </div>
          </div>

          <div class="field">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" placeholder="alex@example.com" autocomplete="email" required>
            <small class="error" id="emailError"></small>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input type="password" id="password" name="password" placeholder="At least 8 characters" autocomplete="new-password" required>
              <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password" aria-pressed="false">
                <svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2.5 12s3.5-5 9.5-5 9.5 5 9.5 5-3.5 5-9.5 5-9.5-5-9.5-5Z"/>
                  <circle cx="12" cy="12" r="2.5"/>
                </svg>
              </button>
            </div>
            <small class="error" id="passwordError"></small>
          </div>

          <label class="terms">
            <input type="checkbox" id="terms" required>
            <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
          </label>
          <small class="error terms-error" id="termsError"></small>

          <button type="submit" class="submit-button">Create account</button>
        </form>

        <p class="signin">Already have an account? <a href="#">Sign in</a></p>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <span class="toast-icon">✓</span>
    <div>
      <strong>Account created</strong>
      <p>Welcome to Nova!</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
